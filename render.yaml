services:
  - type: web
    name: userbot-telegram
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOMBRE
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: GRUPOS
        sync: false
      - key: GRUPO_AUTO
        sync: false
      - key: GRUPO_TRIVIA
        sync: false
      - key: ESTILO
        sync: false
      - key: ALIAS
        sync: false
